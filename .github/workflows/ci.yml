name: CI

# Validates every push and pull request: secret-scan → install → audit →
# typecheck → lint → dead-code → build.
# Keeps main always shippable and gives PRs a green/red signal before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for diff-aware scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high+ severity)
        run: npm audit --audit-level=high

      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck (node)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Test
        run: npm test

      - name: Lint (gated — 0 errors; advisory rules surface as warnings)
        run: npm run lint

      - name: Dead-code guard (no orphaned files or unused deps)
        run: npx knip --include files,dependencies

      - name: Build
        run: npm run build
